apiVersion: 2021-10-01
location: westeurope
name: rag-system-deployment
properties:
  containers:
  - name: rag-app
    properties:
      image: rag-system:latest
      resources:
        requests:
          cpu: 2.0
          memoryInGB: 4.0
        limits:
          cpu: 4.0
          memoryInGB: 8.0
      ports:
      - port: 8000
        protocol: TCP
      environmentVariables:
      - name: AZURE_OPENAI_API_KEY
        secureValue: "${AZURE_OPENAI_API_KEY}"
      - name: AZURE_OPENAI_ENDPOINT
        value: "${AZURE_OPENAI_ENDPOINT}"
      - name: AZURE_OPENAI_API_VERSION
        value: "${AZURE_OPENAI_API_VERSION}"
      - name: AZURE_AI_SEARCH_SERVICE_NAME
        value: "${AZURE_AI_SEARCH_SERVICE_NAME}"
      - name: AZURE_AI_SEARCH_INDEX_NAME
        value: "${AZURE_AI_SEARCH_INDEX_NAME}"
      - name: AZURE_AI_SEARCH_API_KEY
        secureValue: "${AZURE_AI_SEARCH_API_KEY}"
      - name: AZURE_STORAGE_CONNECTION_STRING
        secureValue: "${AZURE_STORAGE_CONNECTION_STRING}"
      - name: AZURE_STORAGE_CONTAINER_NAME
        value: "${AZURE_STORAGE_CONTAINER_NAME}"
      command:
      - chainlit
      - run
      - main_chainlit.py
      - --port
      - "8000"
      - --host
      - "0.0.0.0"
  osType: Linux
  restartPolicy: Always
  ipAddress:
    type: Public
    ports:
    - protocol: TCP
      port: 8000
    dnsNameLabel: rag-system-${UNIQUE_ID}
  tags:
    environment: production
    application: rag-system
    version: "2.0"
